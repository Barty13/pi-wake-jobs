name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Matches the bun that wrote bun.lock. An older bun rejects that
          # lockfile outright, and --frozen-lockfile then has nothing to work from.
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx tsc --noEmit

  # The bottom of the Pi range the README promises. bun add pins the three
  # host-supplied packages to that release and leaves every other dev
  # dependency alone. It rewrites the checkout's package.json and bun.lock;
  # CI never commits them, so the drift stays inside the runner.
  floor:
    name: typecheck on the oldest supported Pi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun add -D @earendil-works/pi-ai@1.1.0 @earendil-works/pi-coding-agent@1.1.0 @earendil-works/pi-tui@1.1.0
      - run: bunx tsc --noEmit
