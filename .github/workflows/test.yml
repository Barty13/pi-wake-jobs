name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Matches the bun that wrote bun.lock. An older bun rejects that
          # lockfile outright, and --frozen-lockfile then has nothing to work from.
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx tsc --noEmit
